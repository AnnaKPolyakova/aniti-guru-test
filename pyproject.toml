[project]
name = "Pay_system"
version = "0.1.0"
description = "Payment system for orders"
authors = [
    {name = "Anna Polyakova",email = "sova408@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "asgi-lifespan (>=2.1.0,<3.0.0)",
    "fastapi-users (>=15.0.4,<16.0.0)",
    "faker (>=40.8.0,<41.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "fastapi-users-db-sqlalchemy (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.5,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "celery (>=5.6.2,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# --- Ruff (линтер + часть форматирования) ---
[tool.ruff]
target-version = "py313"
line-length = 79
src = ["src", "tests"]
lint.select = ["E","F","W","I","UP","B","C4","PIE","SIM","PT","PL","Q","RUF"]
lint.ignore = ["E501", "UP032", "B008", "RUF003", "PLC0415"]
lint.unfixable = ["F401"]
exclude = [
  "alembic",
]

[tool.ruff.lint.isort]
known-first-party = ["acme_app"]
combine-as-imports = true

# --- Mypy (строгий режим с послаблениями на старте) ---
[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["src"]
exclude = "(^|/)alembic/"
